<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Rivya School of Arts</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0a0d;
      color: white;
      font-family: 'Outfit', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(216,27,96,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 2rem; color: #f8bbd0; font-style: italic; margin-bottom: 1rem; }
    h1 { font-size: clamp(5rem, 15vw, 10rem); font-weight: 900; color: #d81b60; line-height: 1; }
    p { font-size: 1.2rem; color: rgba(255,255,255,0.6); margin: 1.5rem 0 2.5rem; max-width: 400px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #d81b60, #ad1457);
      color: white;
      text-decoration: none;
      padding: 1rem 2.5rem;
      border-radius: 100px;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 20px 40px rgba(216,27,96,0.3);
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 30px 50px rgba(216,27,96,0.4); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo">Rivya School of Arts</div>
  <h1>404</h1>
  <p>Oops! This page took a wrong turn. Let's get you back to your canvas.</p>
  <a href="/">← Back to Home</a>
</body>
</html>
